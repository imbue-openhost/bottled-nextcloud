[app]
name = "nextcloud"
version = "0.1.0"
description = "Nextcloud (files / calendar / contacts) with zone_auth single sign-on"
authors = ["Andrew Laack <andrew@laack.co>"]

[runtime.container]
image = "Dockerfile"
# The auth-sidecar listens on 8080.  Apache + PHP run on 127.0.0.1:8081
# inside the container; the sidecar is the only thing that talks to
# the OpenHost router.
port = 8080

[routing]
health_check = "/status.php"
# Every path is "public" at the router level: the auth-sidecar inside
# the container handles SSO selectively, leaving WebDAV (/remote.php
# /dav/...), OCS (/ocs/...), Login Flow v2 (/index.php/login/v2/...)
# and well-known endpoints reachable without zone_auth so native sync
# clients can carry their own app-password Basic Auth.  See README's
# Architecture section for why.
public_paths = ["/"]

[resources]
# Nextcloud + bundled Postgres + bundled Redis + Apache + auth sidecar.
# 1.5 GiB is comfortable for a personal/family deployment of 5-10 users
# with a few TB of data.  Bump if running Talk (video calls) or
# OnlyOffice — neither is shipped here.
memory_mb = 1536
cpu_millicores = 1500

[data]
# Persistent: Postgres data, the generated postgres password, the
# generated bootstrap admin password.  Nextcloud's own data/uploads
# and config directories live inside the container at
# ``/var/www/html/{data,config}`` and are persisted by the upstream
# image's volumes (which OpenHost honours).  The auth-sidecar's JWKS
# cache is in-memory only — it's refetched from the OpenHost router
# on every container start, with stale fallback to handle a router
# restart.
app_data = true
# Per-boot scratch: Apache logs, Postgres logs, Redis runtime state,
# socket dirs.  Survives crashes but not redeploys.
app_temp_data = true
