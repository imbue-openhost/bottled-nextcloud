[app]
name = "nextcloud"
version = "0.1.0"
description = "Nextcloud (files / calendar / contacts) with OpenHost owner single sign-on"
authors = ["Andrew Laack <andrew@laack.co>"]

[runtime.container]
image = "Dockerfile"
# The auth-sidecar listens on 8080.  Apache + PHP run on 127.0.0.1:8081
# inside the container; the sidecar is the only thing that talks to
# the OpenHost router.
port = 8080

[routing]
health_check = "/status.php"
# Every path is "public" at the router level: the auth-sidecar inside
# the container handles SSO selectively, leaving WebDAV (/remote.php
# /dav/...), OCS (/ocs/...), Login Flow v2 (/index.php/login/v2/...),
# public file shares (/index.php/s/...) and well-known endpoints
# reachable without an authenticated owner so native sync clients can
# carry their own app-password Basic Auth and anonymous visitors can
# open public share links.  The router still authenticates the owner
# and stamps the trusted ``X-OpenHost-Is-Owner`` header the sidecar
# reads for SSO.  See README's Architecture section for why.
public_paths = ["/"]

[resources]
# Nextcloud + bundled Postgres + bundled Redis + Apache + auth sidecar.
# 1.5 GiB is comfortable for a personal/family deployment of 5-10 users
# with a few TB of data.  Bump if running Talk (video calls) or
# OnlyOffice — neither is shipped here.
memory_mb = 1536
cpu_millicores = 1500

[data]
# Persistent (local disk): Postgres data, the generated postgres/admin
# passwords, and Nextcloud's own state under
# ``$OPENHOST_APP_DATA_DIR/html`` (config.php, version.php,
# custom_apps/, themes/).  The upstream image mounts /var/www/html as
# an anonymous podman VOLUME, which OpenHost does NOT persist across
# rebuilds, so start.sh keeps that state in app_data and copies it into
# the fresh volume on each boot (see the README's persistence section).
# Postgres and config.php REQUIRE local disk (SQLite/WAL-style fsync
# semantics, low latency) — they must never move to the archive tier.
app_data = true
# Per-boot scratch (local disk): Apache logs, Postgres logs, Redis
# runtime state, socket dirs, and Nextcloud's ``tempdirectory``
# (chunked-upload assembly, file conversions).  Survives crashes but
# not redeploys.
app_temp_data = true
# Archive tier (S3-backed via JuiceFS): Nextcloud's user-file data
# directory (``datadirectory``) lives here so uploads scale elastically
# to object storage instead of being capped by, and bloating backups
# of, the local app_data disk.  This is the flagship use for the
# archive tier (bulk user content).  NOTE: because this is set,
# OpenHost will REFUSE to install or reload this app until the operator
# has configured the zone's S3 archive backend from the dashboard.
app_archive = true
